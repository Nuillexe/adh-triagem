{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ADH Conquista</title>

    <!-- Bootstrap 5 & Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar Superior Responsiva -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
        <div class="container">

            <!-- Logo e Nome da ADH -->
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="{% static 'formulario/img/logo_adh.png' %}" alt="Logo ADH" width="36" height="36" class="me-2 rounded-circle bg-white p-1">
                <span class="fw-bold fs-5">ADH Conquista</span>
            </a>

            <!-- Botão Hambúrguer para Celular -->
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarADH" aria-controls="navbarADH" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Menu de Navegação Retrátil -->
            <div class="collapse navbar-collapse mt-2 mt-lg-0" id="navbarADH">
                <div class="navbar-nav ms-auto gap-2">
                    <a class="btn btn-light btn-sm px-3 text-primary fw-semibold w-100 w-lg-auto text-start text-lg-center" href="#">
                        <i class="bi bi-person-plus-fill me-1"></i> Cadastrar
                    </a>
                    <a class="btn btn-outline-light btn-sm px-3 w-100 w-lg-auto text-start text-lg-center" href="{% url 'relatorios' %}">
                        <i class="bi bi-bar-chart-line-fill me-1"></i> Relatórios e Insights
                    </a>
                    <a class="btn btn-outline-light btn-sm px-3 w-100 w-lg-auto text-start text-lg-center" href="{% url 'logout' %}">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </a>
                </div>
            </div>

        </div>
    </nav>

    <!-- Container Principal do Formulário -->
    <div class="container my-3 my-md-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-7">

                <!-- Mensagens de Erro ou Sucesso -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert {% if message.tags == 'error' %}alert-danger{% elif message.tags == 'success' %}alert-success{% elif message.tags == 'warning' %}alert-warning{% else %}alert-info{% endif %} alert-dismissible fade show shadow-sm rounded-3" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <div class="card shadow-sm border-0 rounded-4">

                    <div class="card-header bg-white text-primary py-3 border-bottom text-center">
                        <h4 class="mb-0 fw-bold fs-5 fs-md-4">
                            Ficha de Atendimento
                        </h4>
                        <small class="text-muted">Ação Comunitária de Saúde</small>
                    </div>

                    <div class="card-body p-3 p-md-4">

                        <!-- Formulário -->
                        <form method="POST">
                            {% csrf_token %}

                            <!-- Dados Pessoais -->
                            <h6 class="text-primary fw-bold text-uppercase small mb-3">
                                1. Dados Pessoais
                            </h6>

                            <div class="mb-3">
                                <label for="nome" class="form-label fw-semibold">
                                    Nome Completo
                                </label>
                                <input type="text" class="form-control form-control-lg fs-6" id="nome" name="nome" placeholder="Nome do participante" required>
                            </div>

                            <div class="row">
                                <div class="col-12 col-sm-5 col-md-4 mb-3">
                                    <label for="idade" class="form-label fw-semibold">
                                        Idade
                                    </label>
                                    <input type="number" class="form-control form-control-lg fs-6" id="idade" name="idade" min="0" max="120" inputmode="numeric" placeholder="Ex: 45" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="condicao_saude" class="form-label fw-semibold">
                                    Condição de Saúde Principal
                                </label>
                                <select class="form-select form-select-lg fs-6" id="condicao_saude" name="condicao_saude" required>
                                    <option value="" selected disabled>Selecione uma opção...</option>
                                    <option value="DM1">Diabetes Tipo 1 (DM1)</option>
                                    <option value="DM2">Diabetes Tipo 2 (DM2)</option>
                                    <option value="DM1&HT">Diabetes Tipo 1 (DM1) e Hipertensão (HT)</option>
                                    <option value="DM2&HT">Diabetes Tipo 2 (DM2) e Hipertensão (HT)</option>
                                    <option value="HT">Hipertensão (HT)</option>
                                    <option value="Nenhum">Nenhum histórico informado</option>
                                </select>
                            </div>

                            <hr class="my-4 text-muted opacity-25">

                            <!-- Dados de Medições -->
                            <h6 class="text-primary fw-bold text-uppercase small mb-3">
                                2. Medições do Evento
                            </h6>

                            <div class="row">
                                <div class="col-12 col-sm-6 mb-3">
                                    <label for="glicemia" class="form-label fw-semibold">
                                        Glicemia (mg/dL)
                                    </label>
                                    <input type="number" class="form-control form-control-lg fs-6" id="glicemia" name="glicemia" min="0" inputmode="numeric" placeholder="Ex: 110">
                                </div>

                                <div class="col-12 col-sm-6 mb-3">
                                    <label for="pressao_arterial" class="form-label fw-semibold">
                                        Pressão Arterial
                                    </label>
                                    <input type="text" class="form-control form-control-lg fs-6" id="pressao_arterial" name="pressao_arterial" placeholder="Ex: 120/80">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="observacao" class="form-label fw-semibold">
                                    Observações
                                </label>
                                <textarea class="form-control" id="observacao" name="observacao" rows="3" placeholder="Anotações adicionais da triagem..."></textarea>
                            </div>

                            <!-- Botão de Envio -->
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg shadow-sm py-3 fw-bold fs-6">
                                    <i class="bi bi-check-circle-fill me-2"></i>Salvar Cadastro
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const campos = document.querySelectorAll('input[required], select[required]');

        campos.forEach(campo => {
            campo.addEventListener('invalid', function () {
                if (this.validity.valueMissing) {
                    this.setCustomValidity('Por favor, preencha este campo.');
                }
            });

            campo.addEventListener('input', function () {
                this.setCustomValidity('');
            });
        });
    </script>
</body>
</html>
