
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - ADH Conquista</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Navbar Superior -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">

            <!-- Logo e Nome da ADH -->
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img
                    src="{% static 'formulario/img/logo_adh.png' %}"
                    alt="Logo ADH"
                    width="40"
                    height="40"
                    class="me-2 rounded-circle bg-white p-1">

                <span>ADH Conquista</span>
            </a>

            <!-- Botões de Navegação -->
            <div class="navbar-nav ms-auto flex-row gap-2">
                <a
                    class="nav-link active btn btn-outline-light btn-sm px-3 text-dark bg-white"
                    href="#">
                    Cadastrar
                </a>

                <a
                    class="nav-link btn btn-outline-light btn-sm px-3 text-white"
                    href="{% url 'relatorios' %}">
                    Relatórios e Insights
                </a>
            </div>

        </div>
    </nav>

    <!-- Container Principal do Formulário -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">

                <!-- Mensagens de Erro ou Sucesso -->
                {% if messages %}
                    {% for message in messages %}
                        <div
                            class="alert {% if message.tags == 'error' %}alert-danger
                                {% elif message.tags == 'success' %}alert-success
                                {% elif message.tags == 'warning' %}alert-warning
                                {% else %}alert-info{% endif %}
                                alert-dismissible fade show shadow-sm"
                                role="alert">

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Fechar">
                            </button>

                        </div>
                    {% endfor %}
                {% endif %}

                <div class="card shadow border-0">

                    <div class="card-header bg-white text-primary py-3">
                        <h4 class="mb-0 text-center fw-bold">
                            Ficha de Atendimento - Ação Comunitária
                        </h4>
                    </div>

                    <div class="card-body p-4">

                        <!-- Formulário -->
                        <form method="POST">
                            {% csrf_token %}

                            <!-- Dados Pessoais -->
                            <h5 class="text-secondary mb-3">
                                1. Dados Pessoais
                            </h5>

                            <div class="mb-3">
                                <label for="nome" class="form-label">
                                    Nome Completo
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="nome"
                                    name="nome"
                                    required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="idade" class="form-label">
                                        Idade
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="idade"
                                        name="idade"
                                        min="0"
                                        max="120"
                                        required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="condicao_saude" class="form-label">
                                    Condição de Saúde Principal
                                </label>

                                <select
                                    class="form-select"
                                    id="condicao_saude"
                                    name="condicao_saude"
                                    required>

                                    <option value="" selected disabled>
                                        Selecione...
                                    </option>

                                    <option value="DM1">
                                        Diabetes Tipo 1 (DM1)
                                    </option>

                                    <option value="DM2">
                                        Diabetes Tipo 2 (DM2)
                                    </option>
                                    
                                    <option value="DM1&HT">
                                        Diabetes Tipo 1 (DM1) e hipertenso(HT)
                                    </option>

                                    <option value="DM2&HT">
                                        Diabetes Tipo 2 (DM2) e hipertenso(HT)
                                    </option>
                                        
                                    <option value="HT">
                                        Hipertensão
                                    </option>

                                    <option value="Nenhum">
                                        Nenhum
                                    </option>

                                </select>
                            </div>

                            <hr class="my-4">

                            <!-- Dados de Medições -->
                            <h5 class="text-secondary mb-3">
                                2. Medições do Evento
                            </h5>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label for="glicemia" class="form-label">
                                        Glicemia (mg/dL)
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="glicemia"
                                        name="glicemia"
                                        min="0"
                                        placeholder="Ex: 110">
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="pressao_arterial" class="form-label">
                                        Pressão Arterial
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="pressao_arterial"
                                        name="pressao_arterial"
                                        placeholder="Ex: 120/80">
                                </div>

                            </div>

                            <div class="mb-3">
                                <label for="observacao" class="form-label">
                                    Observações
                                </label>

                                <textarea
                                    class="form-control"
                                    id="observacao"
                                    name="observacao"
                                    rows="2">
                                </textarea>
                            </div>

                            <hr class="my-4">

                            <!-- Botão de Envio -->
                            <div class="d-grid mt-4">
                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg">
                                    Salvar Cadastro
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
