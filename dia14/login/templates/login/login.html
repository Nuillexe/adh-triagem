<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ADH Conquista</title>
    <!-- Bootstrap 5 e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
        }
        .login-card {
            max-width: 420px;
            border: none;
            border-radius: 16px;
        }
        .btn-custom {
            background-color: #0056b3;
            color: white;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }
        .btn-custom:hover {
            background-color: #004085;
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

<div class="container d-flex justify-content-center">
    <div class="card login-card shadow-lg p-4 p-md-5 w-100">
        
        <!-- Identificação ADH e Nome do Evento -->
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary mb-1">ADH CONQUISTA</h3>
            <p class="text-muted small fw-semibold mb-3">
                Ação Comunitária de Educação e Conscientização sobre o Diabetes
            </p>
            <hr class="my-3 opacity-25">
            <h5 class="fw-bold text-dark text-uppercase fs-6 tracking-wide">
                <i class="bi bi-shield-lock-fill me-1 text-primary"></i> Acesso Restrito
            </h5>
        </div>

        <!-- Exibição de Mensagens (Erros/Sucesso) -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm small" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Formulário de Login -->
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold small text-secondary">E-mail ou Nome de Usuário</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-fill text-muted"></i></span>
                    <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="Digite seu e-mail ou usuário" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="senha" class="form-label fw-semibold small text-secondary">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key-fill text-muted"></i></span>
                    <input type="password" class="form-control border-start-0 ps-0" id="senha" name="senha" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-custom py-2 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Acessar Relatórios
                </button>
                <a href="{% url 'cadastrar_participante' %}" class="btn btn-outline-secondary py-2 border-0 bg-light text-muted small">
                    <i class="bi bi-arrow-left me-1"></i> Voltar ao Formulário Público
                </a>
            </div>
        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const campos = document.querySelectorAll('input[required]');

    campos.forEach(campo => {
        campo.addEventListener('invalid', function () {
            if (this.validity.valueMissing) {
                this.setCustomValidity('Por favor, preencha este campo.');
            }
        });

        campo.addEventListener('input', function () {
            this.setCustomValidity('');
        });
    });
</script>

</body>
</html>
